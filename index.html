<meta name="theme-color" content="#b4245f">

<title>الوفاء المتميز ليبيا — بوت بنات جملة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Reem+Kufi:wght@600;700&display=swap">
<style id="css">
/* Layout: catalog grid of product cards, sticky cart bar at the bottom, sheets for zoom, invoice and owner tools */
:root{--bg:#fbf4f7;--surface:#ffffff;--ink:#2e1838;--muted:#6f5a78;--accent:#b4245f;--accent-ink:#ffffff;--soft:#f6dde8;--line:#ead4de;--ok:#1f7a4d;--warn:#b45309;--scrim:rgba(24,10,30,.62);--zoombg:rgba(18,8,24,.94);
--f-display:"Reem Kufi","Cairo",Tahoma,Arial,sans-serif;--f-body:"Cairo",Tahoma,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b0f22;--surface:#28172f;--ink:#f7e8ef;--muted:#c3a8b7;--accent:#ff7aa8;--accent-ink:#2a0d1a;--soft:#3f2249;--line:#4a2c57;--ok:#5fd39a;--warn:#f0a94a;--scrim:rgba(0,0,0,.7);--zoombg:rgba(6,2,9,.96);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b0f22;--surface:#28172f;--ink:#f7e8ef;--muted:#c3a8b7;--accent:#ff7aa8;--accent-ink:#2a0d1a;--soft:#3f2249;--line:#4a2c57;--ok:#5fd39a;--warn:#f0a94a;--scrim:rgba(0,0,0,.7);--zoombg:rgba(6,2,9,.96);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-block:22px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-family:var(--f-display);font-weight:700;font-size:clamp(1.35rem,5.4vw,2.1rem);line-height:1.2;margin:0;text-wrap:balance}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:.8rem;color:var(--muted);direction:ltr;text-align:right;letter-spacing:.04em}
.sub{margin:4px 0 0;color:var(--muted)}
.tag{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 12px;border-radius:99px;font-size:.85rem}
.ownerbar{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
@media (max-width:460px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ph{position:relative;display:block;width:100%;padding:0;border:0;background:var(--soft);aspect-ratio:4/5;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph .cnt{position:absolute;bottom:8px;inset-inline-start:8px;background:var(--scrim);color:#fff;font-size:.75rem;font-weight:700;padding:0 8px;border-radius:99px}
.ph .noimg{display:grid;place-items:center;height:100%;color:var(--muted);font-size:.9rem}
.out .ph img{filter:grayscale(1);opacity:.6}
.badge{position:absolute;top:8px;inset-inline-end:8px;background:var(--ink);color:var(--bg);font-weight:900;font-size:.8rem;padding:2px 10px;border-radius:99px}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.code{font-weight:900;font-size:1.1rem;line-height:1.3}
.rows{display:grid;grid-template-columns:auto 1fr;gap:0 10px;font-size:.88rem;margin:0}
.rows dt{color:var(--muted)}
.rows dd{margin:0;font-weight:700;text-align:left}
.stock{font-size:.85rem;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--soft);text-align:center}
.stock.low{color:var(--warn)}
.stock.zero{color:var(--accent)}
.qty{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.qty button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:1.25rem;font-weight:700;line-height:1}
.qty .q{font-weight:900;font-size:1.1rem;text-align:center;flex:1}
.qty button:disabled{opacity:.35;cursor:not-allowed}
.add{margin-top:auto;width:100%;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:12px;padding:8px;font-weight:700}
.add:disabled{border-color:var(--line);color:var(--muted);cursor:not-allowed}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:980px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar b{font-size:1.05rem}
.bar small{display:block;color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.box h2{font-family:var(--f-display);margin:0 0 4px;font-size:1.4rem}
.inv{border:1.5px dashed var(--line);border-radius:14px;padding:14px;margin:12px 0;background:var(--bg)}
.inv .hd{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:.88rem;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px}
.tblw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:600}
td.n,th.n{text-align:left}
tfoot td{font-weight:900;border-bottom:0;font-size:1rem}
label.f{display:flex;flex-direction:column;gap:2px;font-size:.85rem;color:var(--muted);flex:1;min-width:140px}
label.f input,label.f textarea{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:7px 10px;color:var(--ink);width:100%}
.frow{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.wa{display:block;text-align:center;background:var(--ok);color:#fff;text-decoration:none;font-weight:900;padding:13px;border-radius:14px;font-size:1.05rem}
.note{font-size:.85rem;color:var(--muted);margin:6px 0}
.phone{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--soft);border-radius:10px;padding:6px 10px;font-weight:700}
#zoom{position:fixed;inset:0;z-index:60;background:var(--zoombg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:calc(56px + env(safe-area-inset-top,0px));padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
#zoom img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;touch-action:pinch-zoom}
#zoom .zt{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 14px;color:#fff;font-weight:700}
#zoom .zt button{background:#fff;color:#2e1838;border:0;border-radius:99px;padding:5px 16px;font-weight:700}
#zoom .zn{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;color:#fff}
#zoom .zn button{width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#2e1838;font-size:1.3rem;font-weight:900}
/* owner editor */
.ed{display:flex;flex-direction:column;gap:6px;padding:10px 12px 12px}
.ed label{display:flex;flex-direction:column;font-size:.75rem;color:var(--muted)}
.ed input{border:1.5px solid var(--line);border-radius:8px;background:var(--bg);padding:4px 8px;width:100%;color:var(--ink);font-weight:700}
.ed .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumbs .t{position:relative;width:52px;height:64px;border-radius:8px;overflow:hidden;border:2px solid transparent}
.thumbs .t.main{border-color:var(--accent)}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs .t button{position:absolute;top:2px;inset-inline-end:2px;width:20px;height:20px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:.75rem;line-height:1;padding:0}
.thumbs .t .mk{inset-inline-end:auto;inset-inline-start:2px;background:var(--accent);color:var(--accent-ink)}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return Number(n||0).toLocaleString('en-US')}
function find(id){for(var i=0;i<D.products.length;i++)if(D.products[i].id===id)return D.products[i];return null}
function cartons(n){return n===1?'كرتونة واحدة':n===2?'كرتونتان':(n>=3&&n<=10?n+' كراتين':n+' كرتونة')}
function toast(t,ms){var el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(function(){el.remove()},ms||2800)}
function digits(s){return String(s||'').replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/\D/g,'')}
function waOf(s){var n=digits(s).replace(/^00/,'');if(/^0\d{9}$/.test(n))n='218'+n.slice(1);else if(/^9\d{8}$/.test(n))n='218'+n;return n}
function cartCount(){var n=0;for(var k in cart)n+=cart[k];return n}
function today(){return new Date().toLocaleDateString('en-GB')}
function invNo(){var d=new Date(),z=function(n){return(n<10?'0':'')+n};return String(d.getFullYear()).slice(2)+z(d.getMonth()+1)+z(d.getDate())+'-'+z(d.getHours())+z(d.getMinutes())+Math.floor(Math.random()*90+10)}
function closeSheets(){document.querySelectorAll('.sheet').forEach(function(s){s.remove()})}
function sheet(id,label,inner){closeSheets();document.body.insertAdjacentHTML('beforeend','<div class="sheet" id="'+id+'"><div class="box" role="dialog" aria-label="'+esc(label)+'">'+inner+'</div></div>')}
function sortP(a){return a.sort(function(x,y){return (x.order||0)-(y.order||0)})}

/* ---------- storage ---------- */
function saveCart(){try{localStorage.setItem('wf_cart',JSON.stringify(cart))}catch(e){}}
function loadCart(){try{var c=JSON.parse(localStorage.getItem('wf_cart')||'{}');for(var k in c)if(c[k]>0)cart[k]=c[k]}catch(e){}}
function fixCart(){var ch=false;for(var k in cart){var p=find(k);if(!p||p.stock<=0){delete cart[k];ch=true}else if(cart[k]>p.stock){cart[k]=p.stock;ch=true}}if(ch)saveCart()}
try{var cs=JSON.parse(localStorage.getItem('wf_cust')||'null');if(cs)cust=Object.assign(cust,cs)}catch(e){}

function render(){
 if(isAdminUrl){renderAdmin();return}
 var h='<div class="wrap"><header class="top"><div><div class="brandrow"><img class="logo" src="'+LOGO+'" alt="TS"><h1 class="brand">'+esc(D.shop)+'<small>'+esc(D.shopLatin||'')+'</small></h1></div>'+
 '<p class="sub"><span class="tag">جملة فقط</span> بوت بنات — اطلب بالكرتونة، والكمية المتوفرة تتحدث مباشرة.</p></div>';
 h+='<button class="cartbtn" id="openCart" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.2L21 8H6.2"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>السلة<span class="bdg num">'+cartCount()+'</span></button>';
 h+='</header>';
 if(!live)h+='<p class="note live">'+(dbErr?'⚠️ تعذّر الاتصال بالمخزون المباشر. تأكد من الإنترنت ثم حدّث الصفحة.':'جارٍ تحميل الكميات المتوفرة…')+'</p>';

function shopCard(p){
 var inCart=cart[p.id]||0,left=p.stock-inCart,out=p.stock<=0;
 var img=p.images&&p.images.length?'<img src="'+p.images[0]+'" alt="بوت '+esc(p.code)+'" loading="lazy">'+(p.images.length>1?'<span class="cnt">'+p.images.length+' صور</span>':''):'<span class="noimg">بدون صورة</span>';
 var st=out?'<div class="stock zero">نفدت الكمية</div>':'<div class="stock'+(left<=1?' low':'')+'">المتوفر: '+cartons(left)+'</div>';

 return '<article class="card'+(out?' out':'')+'"><button class="ph" data-zoom="'+p.id+'" aria-label="تكبير صورة '+esc(p.code)+'">'+img+(out?'<span class="badge">نفد</span>':'')+'</button><div class="info"><div class="code num">'+esc(p.code)+'</div>'+(p.name?'<div class="pname">'+esc(p.name)+'</div>':'')+
 '<dl class="rows"><dt>المقاسات</dt><dd class="num">'+esc(p.sizes)+'</dd><dt>عبوة الكرتونة</dt><dd>'+p.pack+' قطعة</dd><dt>سعر القطعة</dt><dd>'+money(p.price)+' د.ل</dd><dt>سعر الكرتونة</dt><dd>'+money(p.price*p.pack)+' د.ل</dd></dl>'+st+ctl+'</div></article>';
}

function sendOrder(){
 syncCust();
 if(!cust.name){invErr('اكتب اسم الزبون أو المحل.','cName');return}
 if(waOf(cust.tel).length<9){invErr('اكتب رقم الواتساب ليصلك رد قبول الطلب.','cTel');return}
 if(!live){invErr('لا يوجد اتصال بالمخزون الآن. تأكد من الإنترنت ثم حاول مرة أخرى.');return}
 if(busy)return;busy=true;
 var b=document.getElementById('sendOrder');b.disabled=true;b.textContent='جارٍ إرسال الطلب…';
 var L=flat(invLines()),T=totals(invLines()),no=curInv,F=fb.fs;lastOrder={no:no,date:today(),customer:{name:cust.name,city:cust.city,tel:cust.tel,note:cust.note},lines:L,totals:T};
 F.runTransaction(db,function(tx){
  var refs=L.map(function(l){return F.doc(db,'products',l.id)});
  return Promise.all(refs.map(function(r){return tx.get(r)})).then(function(snaps){
   var short=[];
   snaps.forEach(function(s,i){var st=s.exists()?(s.data().stock||0):0;if(st<L[i].q)short.push(L[i].code+' (المتوفر '+st+')')});
   if(short.length){var e=new Error('short');e.short=short;throw e}
   snaps.forEach(function(s,i){tx.update(refs[i],{stock:s.data().stock-L[i].q})});
   tx.set(F.doc(F.collection(db,'orders')),{no:no,date:today(),status:'new',createdAt:F.serverTimestamp(),customer:{name:cust.name,city:cust.city,tel:cust.tel,note:cust.note},lines:L,totals:T});
  });
 }).then(function(){

  '<p class="note" style="text-align:center;margin:10px 0 0"><b>هذه نسختك من الفاتورة:</b></p>'+paperHtml(lastOrder)+
  '<div class="acts"><button class="btn acc lg" id="saveInv" type="button">📥 حفظ صورة الفاتورة</button><a class="wa" id="selfWa" href="https://wa.me/'+waOf(cust.tel)+'?text='+encodeURIComponent(orderText(lastOrder))+'" target="_blank" rel="noopener">إرسال نسخة إلى واتسابي</a><button class="btn ghost" data-close="1" type="button">تم</button></div>');
 },function(e){
  busy=false;b.disabled=false;b.textContent='موافق — أرسل الطلب';
  if(e&&e.short){invErr('الكمية تغيّرت بسبب طلبات زبائن آخرين: '+e.short.join('، ')+'. عدّل السلة ثم أرسل مرة أخرى.');fixCart();render();return}
  invErr('تعذّر إرسال الطلب. تأكد من الإنترنت ثم حاول مرة أخرى.');console.error(e);
 });
}

function openZoom(p){if(!p||!p.images||!p.images.length)return;zoomList=p.images;zoomI=0;zoomTitle=p.code;drawZoom()}

 document.getElementById('zImg').src=zoomList[zoomI];document.getElementById('zImg').alt='بوت '+zoomTitle;document.getElementById('zT').textContent=zoomTitle;
 document.getElementById('zN').hidden=zoomList.length<2;document.getElementById('zC').textContent=(zoomI+1)+' / '+zoomList.length}
function closeZoom(){var z=document.getElementById('zoom');if(z)z.remove()}
function step(d){zoomI=(zoomI+d+zoomList.length)%zoomList.length;drawZoom()}
var tx0=null;
document.addEventListener('touchstart',function(e){if(e.target.id==='zImg'&&e.touches.length===1)tx0=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',function(e){if(tx0!==null&&e.changedTouches.length){var dx=e.changedTouches[0].clientX-tx0;if(Math.abs(dx)>50&&zoomList.length>1)step(dx>0?1:-1)}tx0=null},{passive:true});

 if(ds.dec){cart[ds.dec]=Math.max(0,(cart[ds.dec]||0)-1);if(!cart[ds.dec])delete cart[ds.dec];curInv=null;saveCart();render();return}
 if(ds.tab){adminTab=ds.tab;render();return}
 if(ds.store){try{fb.fs.updateDoc(fb.fs.doc(db,'orders',ds.store),{sentToStore:true})}catch(er){}return}
 if(ds.accept){acceptOrder(ds.accept);return}
 if(ds.reject){if(ds.sure)rejectOrder(ds.reject);else{ds.sure='1';t.textContent='اضغط مرة ثانية لتأكيد الرفض'}return}
 if(ds.readai){readCard(find(ds.readai));return}
 if(ds.savep){var sp=find(ds.savep);sp._dirty=false;saveProduct(sp);return}
 if(ds.delp){if(ds.sure){var dp=ds.delp;fb.fs.deleteDoc(fb.fs.doc(db,'products',dp)).then(function(){toast('تم حذف الصنف')},function(er){toast(permMsg(er))})}else{ds.sure='1';t.textContent='اضغط مرة ثانية لتأكيد الحذف'}return}
 if(ds.rmimg){var rp=find(ds.rmimg);rp.images.splice(+ds.i,1);rp._dirty=true;render();return}
 if(ds.mainimg){var mp=find(ds.mainimg),x=mp.images.splice(+ds.i,1)[0];mp.images.unshift(x);mp._dirty=true;render();return}
 switch(t.id){
  case 'openCart':case 'openCart2':case 'backCart':openCart();return;
  case 'clearCart':if(ds.sure){cart={};curInv=null;saveCart();closeSheets();render()}else{ds.sure='1';t.textContent='اضغط مرة ثانية للتأكيد'}return;
  case 'toInv':openInvoice();return;
  case 'sendOrder':sendOrder();return;
  case 'saveInv':if(lastOrder)saveImg(lastOrder.no);return;
  case 'zClose':closeZoom();return;
  case 'zPrev':step(-1);return;
  case 'zNext':step(1);return;
  case 'logout':fb.auth.signOut(auth);return;
  case 'seed':seed();return;
  case 'xlsTpl':xlTemplate();return;
  case 'saveAll':saveAll();return;
  case 'xlGo':xlSave();return;
  case 'addProd':var np={id:'p'+Date.now().toString(36),code:'صنف جديد',sizes:'',pack:18,price:50,stock:0,images:[],order:D.products.length+1,_dirty:true};D.products.push(np);render();return;
  case 'forgot':var em=(document.getElementById('lEmail').value||'').trim();if(!em){toast('اكتب بريدك الإلكتروني أولاً');return}fb.auth.sendPasswordResetEmail(auth,em).then(function(){toast('أرسلنا رابط تغيير كلمة السر إلى بريدك',4000)},function(){toast('تعذّر الإرسال. تأكد من البريد.')});return;
 }
});
document.addEventListener('submit',function(e){if(e.target.id!=='loginF')return;e.preventDefault();
 var em=document.getElementById('lEmail').value.trim(),pw=document.getElementById('lPass').value,er=document.getElementById('lErr');
 fb.auth.signInWithEmailAndPassword(auth,em,pw).catch(function(x){er.hidden=false;er.textContent=/invalid|wrong|not-found|credential/.test(x.code||'')?'البريد أو كلمة السر غير صحيحة.':x.code==='auth/too-many-requests'?'محاولات كثيرة. انتظر قليلاً.':'تعذّر الدخول. تأكد من الإنترنت. ('+(x.code||'')+')'})});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeZoom();closeSheets()}if(document.getElementById('zoom')){if(e.key==='ArrowLeft')step(1);if(e.key==='ArrowRight')step(-1)}});
document.addEventListener('input',function(e){var t=e.target;
 if(t.dataset.f){var p=find(t.dataset.id),f=t.dataset.f;p[f]=(f==='code'||f==='sizes'||f==='name')?t.value.trim():Math.max(0,Number(t.value)||0);p._dirty=true;var b=document.querySelector('[data-savep="'+p.id+'"]');if(b)b.disabled=false;var c=t.closest('.card');if(c)c.classList.add('dirty');return}
 if(t.id==='storeNum'){try{localStorage.setItem('wf_store',t.value.trim())}catch(er){}document.querySelectorAll('a[data-store]').forEach(function(a){var o=orders.filter(function(x){return x.id===a.dataset.store})[0];if(o)a.href=storeLink(o)});return}
 if(t.id==='cName'||t.id==='cCity'||t.id==='cNote'||t.id==='cTel')syncCust();
});
document.addEventListener('change',function(e){var t=e.target;if(t.id==='aiIn'){var af=[].slice.call(t.files||[]);t.value='';if(af.length&&fbApp)photoBatch(af);return}if(t.id==='xlsIn'){var xf=t.files&&t.files[0];t.value='';if(xf)xlRead(xf);return}if(!t.dataset.upl)return;var p=find(t.dataset.upl),fs=[].slice.call(t.files||[]);if(!fs.length)return;toast('جارٍ تجهيز الصور…');
 Promise.all(fs.map(shrink)).then(function(a){var first=!(p.images&&p.images.length);p.images=(p.images||[]).concat(a);p._dirty=true;render();if(first&&(!p.code||p.code==='صنف جديد'||!p.sizes))readCard(p)},function(){toast('تعذّرت قراءة إحدى الصور')})});
window.addEventListener('hashchange',function(){var a=/admin/i.test(location.hash);if(a!==isAdminUrl){isAdminUrl=a;closeSheets();if(a&&user)watchOrders();else if(!a&&unsubOrders){unsubOrders();unsubOrders=null;seenNew=null}render()}});

/* ---------- start ---------- */
D.products.forEach(function(p,i){p.order=p.order||i+1});
loadCart();render();
Promise.all([import(G+'firebase-app.js'),import(G+'firebase-firestore.js'),import(G+'firebase-auth.js')]).then(function(m){
 fb={app:m[0],fs:m[1],auth:m[2]};
 var fa=m[0].initializeApp(CFG);fbApp=fa;db=m[1].getFirestore(fa);auth=m[2].getAuth(fa);
 m[1].onSnapshot(m[1].collection(db,'products'),function(s){
  if(!s.empty){
   var dirtyMap={};D.products.forEach(function(p){if(p._dirty)dirtyMap[p.id]=p});
   D.products=sortP(s.docs.map(function(d){var x=d.data();x.id=d.id;return dirtyMap[d.id]||x}));
   Object.keys(dirtyMap).forEach(function(k){if(!find(k))D.products.push(dirtyMap[k])});
   D.fromDb=true;
  }else D.fromDb=false;
  live=true;dbErr='';fixCart();
  if(!editing()&&!document.querySelector('.sheet'))render();
  else if(document.getElementById('cartS'))openCart();
 },function(e){console.error(e);dbErr=e.code||'err';live=false;render()});
 m[2].onAuthStateChanged(auth,function(u){user=u;if(u&&isAdminUrl)watchOrders();else{if(unsubOrders){unsubOrders();unsubOrders=null}orders=[];seenNew=null}render()});
 render();
}).catch(function(e){console.error(e);dbErr='load';render()});
})();

</script>
