<style id="css">
/* Layout: catalog grid of product cards, sticky cart bar at the bottom, sheets for zoom, invoice and owner tools */
:root{--bg:#fbf4f7;--surface:#ffffff;--ink:#2e1838;--muted:#6f5a78;--accent:#b4245f;--accent-ink:#ffffff;--soft:#f6dde8;--line:#ead4de;--ok:#1f7a4d;--warn:#b45309;--scrim:rgba(24,10,30,.62);--zoombg:rgba(18,8,24,.94);
--f-display:"Reem Kufi","Cairo",Tahoma,Arial,sans-serif;--f-body:"Cairo",Tahoma,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b0f22;--surface:#28172f;--ink:#f7e8ef;--muted:#c3a8b7;--accent:#ff7aa8;--accent-ink:#2a0d1a;--soft:#3f2249;--line:#4a2c57;--ok:#5fd39a;--warn:#f0a94a;--scrim:rgba(0,0,0,.7);--zoombg:rgba(6,2,9,.96);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b0f22;--surface:#28172f;--ink:#f7e8ef;--muted:#c3a8b7;--accent:#ff7aa8;--accent-ink:#2a0d1a;--soft:#3f2249;--line:#4a2c57;--ok:#5fd39a;--warn:#f0a94a;--scrim:rgba(0,0,0,.7);--zoombg:rgba(6,2,9,.96);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-block:22px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-family:var(--f-display);font-weight:700;font-size:clamp(1.35rem,5.4vw,2.1rem);line-height:1.2;margin:0;text-wrap:balance}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:.8rem;color:var(--muted);direction:ltr;text-align:right;letter-spacing:.04em}
.sub{margin:4px 0 0;color:var(--muted)}
.tag{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 12px;border-radius:99px;font-size:.85rem}
.ownerbar{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
@media (max-width:460px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ph{position:relative;display:block;width:100%;padding:0;border:0;background:var(--soft);aspect-ratio:4/5;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph .cnt{position:absolute;bottom:8px;inset-inline-start:8px;background:var(--scrim);color:#fff;font-size:.75rem;font-weight:700;padding:0 8px;border-radius:99px}
.ph .noimg{display:grid;place-items:center;height:100%;color:var(--muted);font-size:.9rem}
.out .ph img{filter:grayscale(1);opacity:.6}
.badge{position:absolute;top:8px;inset-inline-end:8px;background:var(--ink);color:var(--bg);font-weight:900;font-size:.8rem;padding:2px 10px;border-radius:99px}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.code{font-weight:900;font-size:1.1rem;line-height:1.3}
.rows{display:grid;grid-template-columns:auto 1fr;gap:0 10px;font-size:.88rem;margin:0}
.rows dt{color:var(--muted)}
.rows dd{margin:0;font-weight:700;text-align:left}
.stock{font-size:.85rem;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--soft);text-align:center}
.stock.low{color:var(--warn)}
.stock.zero{color:var(--accent)}
.qty{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.qty button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:1.25rem;font-weight:700;line-height:1}
.qty .q{font-weight:900;font-size:1.1rem;text-align:center;flex:1}
.qty button:disabled{opacity:.35;cursor:not-allowed}
.add{margin-top:auto;width:100%;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:12px;padding:8px;font-weight:700}
.add:disabled{border-color:var(--line);color:var(--muted);cursor:not-allowed}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:980px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar b{font-size:1.05rem}
.bar small{display:block;color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.box h2{font-family:var(--f-display);margin:0 0 4px;font-size:1.4rem}
.inv{border:1.5px dashed var(--line);border-radius:14px;padding:14px;margin:12px 0;background:var(--bg)}
.inv .hd{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:.88rem;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px}
.tblw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:600}
td.n,th.n{text-align:left}
tfoot td{font-weight:900;border-bottom:0;font-size:1rem}
label.f{display:flex;flex-direction:column;gap:2px;font-size:.85rem;color:var(--muted);flex:1;min-width:140px}
label.f input,label.f textarea{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:7px 10px;color:var(--ink);width:100%}
.frow{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.wa{display:block;text-align:center;background:var(--ok);color:#fff;text-decoration:none;font-weight:900;padding:13px;border-radius:14px;font-size:1.05rem}
.note{font-size:.85rem;color:var(--muted);margin:6px 0}
.phone{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--soft);border-radius:10px;padding:6px 10px;font-weight:700}
#zoom{position:fixed;inset:0;z-index:60;background:var(--zoombg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:calc(56px + env(safe-area-inset-top,0px));padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
#zoom img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;touch-action:pinch-zoom}
#zoom .zt{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 14px;color:#fff;font-weight:700}
#zoom .zt button{background:#fff;color:#2e1838;border:0;border-radius:99px;padding:5px 16px;font-weight:700}
#zoom .zn{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;color:#fff}
#zoom .zn button{width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#2e1838;font-size:1.3rem;font-weight:900}
/* owner editor */
.ed{display:flex;flex-direction:column;gap:6px;padding:10px 12px 12px}
.ed label{display:flex;flex-direction:column;font-size:.75rem;color:var(--muted)}
.ed input{border:1.5px solid var(--line);border-radius:8px;background:var(--bg);padding:4px 8px;width:100%;color:var(--ink);font-weight:700}
.ed .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumbs .t{position:relative;width:52px;height:64px;border-radius:8px;overflow:hidden;border:2px solid transparent}
.thumbs .t.main{border-color:var(--accent)}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs .t button{position:absolute;top:2px;inset-inline-end:2px;width:20px;height:20px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:.75rem;line-height:1;padding:0}
.thumbs .t .mk{inset-inline-end:auto;inset-inline-start:2px;background:var(--accent);color:var(--accent-ink)}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return Number(n||0).toLocaleString('en-US')}
function find(id){for(var i=0;i<D.products.length;i++)if(D.products[i].id===id)return D.products[i];return null}
function cartons(n){return n===1?'كرتونة واحدة':n===2?'كرتونتان':(n>=3&&n<=10?n+' كراتين':n+' كرتونة')}
function toast(t,ms){var el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(function(){el.remove()},ms||2800)}
function digits(s){return String(s||'').replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/\D/g,'')}
function waOf(s){var n=digits(s).replace(/^00/,'');if(/^0\d{9}$/.test(n))n='218'+n.slice(1);else if(/^9\d{8}$/.test(n))n='218'+n;return n}
function cartCount(){var n=0;for(var k in cart)n+=cart[k];return n}
function today(){return new Date().toLocaleDateString('en-GB')}
function invNo(){var d=new Date(),z=function(n){return(n<10?'0':'')+n};return String(d.getFullYear()).slice(2)+z(d.getMonth()+1)+z(d.getDate())+'-'+z(d.getHours())+z(d.getMinutes())+Math.floor(Math.random()*90+10)}

function sheet(id,label,inner){closeSheets();document.body.insertAdjacentHTML('beforeend','<div class="sheet" id="'+id+'"><div class="box" role="dialog" aria-label="'+esc(label)+'">'+inner+'</div></div>')}
function sortP(a){return a.sort(function(x,y){return (x.order||0)-(y.order||0)})}

function saveCart(){try{localStorage.setItem('wf_cart',JSON.stringify(cart))}catch(e){}}

function fixCart(){var ch=false;for(var k in cart){var p=find(k);if(!p||p.stock<=0){delete cart[k];ch=true}else if(cart[k]>p.stock){cart[k]=p.stock;ch=true}}if(ch)saveCart()}

 m[2].onAuthStateChanged(auth,function(u){user=u;if(u&&isAdminUrl){watchOrders();watchPrepAll()}else{if(unsubOrders){unsubOrders();unsubOrders=null}orders=[];seenNew=null}render()});
 render();
}).catch(function(e){console.error(e);dbErr='load';render()});
})();

</script>

<script>
(function(){

 ];
